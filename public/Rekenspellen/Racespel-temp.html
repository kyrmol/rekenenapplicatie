<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekenrace Groep 8</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e8f5ff;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
            background-color: #a8e6cf;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .race-track {
            position: relative;
            height: 400px;
            background-image: linear-gradient(#a8e6cf, #dcedc1);
            border-bottom: 8px dashed #444;
        }

        .finish-line {
            position: absolute;
            top: 0;
            right: 50px;
            height: 100%;
            width: 10px;
            background: repeating-linear-gradient(
                    45deg,
                    #000,
                    #000 10px,
                    #fff 10px,
                    #fff 20px
            );
        }

        .player {
            position: absolute;
            width: 80px;
            height: 80px;
            transition: left 0.5s ease;
        }

        .player-car {
            width: 100%;
            height: 100%;
        }

        .player-name {
            position: absolute;
            font-weight: bold;
            font-size: 12px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 2px 6px;
            border-radius: 10px;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .control-panel {
            background-color: #ffd3b6;
            padding: 15px;
            border-radius: 0 0 15px 15px;
            position: relative;
        }

        .math-problem {
            font-size: 1.8em;
            font-weight: bold;
            margin: 10px 0;
            color: #444;
        }

        input {
            font-size: 1.5em;
            width: 100px;
            padding: 5px;
            text-align: center;
            border: 3px solid #ff8b94;
            border-radius: 10px;
            margin-right: 10px;
        }

        button {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.2em;
            background-color: #ff8b94;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #ff6b6b;
            transform: scale(1.05);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            height: 20px;
            margin-top: 10px;
            font-weight: bold;
            color: #ff6b6b;
        }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2em;
            display: none;
            z-index: 100;
        }

        .game-over button {
            margin-top: 20px;
            font-size: 1em;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff6b6b;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(500px) rotate(360deg); opacity: 0; }
        }

        .timer-container {
            position: absolute;
            top: 40px;  /* Verlaagd van bovenkant scherm */
            right: 10px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #444;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-bar-container {
            width: 100%;
            height: 5px;
            background-color: #ddd;
            border-radius: 3px;
            margin-top: 3px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background-color: #ff6b6b;
            width: 100%;
            transition: width 0.1s linear;
        }

        /* Styling voor hints */
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 10px;
            border: 2px solid #ff8b94;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
            color: #444;
            text-align: center;
            max-width: 80%;
            z-index: 5;
            display: none;
        }
    </style>
</head>
<body>
<h1>Rekenrace Groep 8!</h1>

<div class="game-container">
    <div class="race-track">
        <div class="finish-line"></div>
        <div class="timer-container">
            <div>Tijd: <span id="timer">10</span>s</div>
            <div class="timer-bar-container">
                <div class="timer-bar" id="timerBar"></div>
            </div>
        </div>

        <!-- Hint element -->
        <div class="hint" id="hint"></div>

        <!-- Players zullen hier worden toegevoegd via JavaScript -->
    </div>

    <div class="control-panel">
        <div class="math-problem" id="problem">10 + 5 = ?</div>
        <input type="number" id="answer" placeholder="?" autofocus>
        <button id="submitBtn">Controleer</button>
        <div class="message" id="message"></div>
    </div>

    <div class="game-over" id="gameOver">
        <div id="gameOverText">Game Over!</div>
        <button id="restartBtn">Opnieuw spelen</button>
    </div>
</div>

<script>
    // Racespel JavaScript code

    // Spelconfiguratie
    const config = {
        playerCount: 3,
        turnTime: 10, // seconden per beurt
        racetrackLength: 750,
        finishPosition: 700,
        speedPerCorrectAnswer: 100,
        difficultyIncrease: 0.2,
        SPEL_ID: 1, // ID van Racespel in database
        consecutiveWrongThreshold: 2 // Na hoeveel foute antwoorden een hint wordt getoond
    };

    // Spelvariabelen
    let players = [];
    let currentPlayer = 0;
    let timer;
    let remainingTime = config.turnTime;
    let difficulty = 1;
    let mathProblem = {};
    let gameEnded = false;
    let consecutiveWrong = 0; // Teller voor opeenvolgende foute antwoorden

    // DOM-elementen
    const problemElement = document.getElementById('problem');
    const answerElement = document.getElementById('answer');
    const submitBtn = document.getElementById('submitBtn');
    const messageElement = document.getElementById('message');
    const timerElement = document.getElementById('timer');
    const timerBar = document.getElementById('timerBar');
    const gameOverElement = document.getElementById('gameOver');
    const gameOverTextElement = document.getElementById('gameOverText');
    const restartBtn = document.getElementById('restartBtn');
    const raceTrack = document.querySelector('.race-track');
    const hintElement = document.getElementById('hint');

    // Event listeners
    submitBtn.addEventListener('click', checkAnswer);
    answerElement.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });
    restartBtn.addEventListener('click', resetGame);

    // Spelers initialiseren
    function initializePlayers() {
        const playerNames = ['Jij', 'Computer 1', 'Computer 2'];
        const playerColors = ['#ff6b6b', '#5facee', '#69db7c'];
        const playerIcons = ['🚗', '🚙', '🏎️'];

        players = [];

        for (let i = 0; i < config.playerCount; i++) {
            const player = {
                name: playerNames[i],
                color: playerColors[i],
                icon: playerIcons[i],
                position: 0,
                element: null
            };

            players.push(player);

            // Maak het speler-element
            const playerElement = document.createElement('div');
            playerElement.className = 'player';
            playerElement.style.bottom = `${50 + i * 100}px`;
            playerElement.style.left = '0px';

            const playerCar = document.createElement('div');
            playerCar.className = 'player-car';
            playerCar.textContent = player.icon;
            playerCar.style.fontSize = '60px';

            const playerName = document.createElement('div');
            playerName.className = 'player-name';
            playerName.textContent = player.name;
            playerName.style.backgroundColor = player.color;

            playerElement.appendChild(playerCar);
            playerElement.appendChild(playerName);
            raceTrack.appendChild(playerElement);

            player.element = playerElement;
        }
    }

    // Genereer een willekeurig rekenprobleem op basis van de huidige moeilijkheidsgraad
    function generateMathProblem() {
        const operations = ['+', '-', '×', '÷'];
        const operationType = Math.floor(Math.random() * 4); // 0=optellen, 1=aftrekken, 2=vermenigvuldigen, 3=delen
        const operation = operations[operationType];

        let num1, num2, answer;

        switch(operationType) {
            case 0: // Optellen
                num1 = Math.floor(Math.random() * (10 * difficulty)) + 1;
                num2 = Math.floor(Math.random() * (10 * difficulty)) + 1;
                answer = num1 + num2;
                break;
            case 1: // Aftrekken
                num1 = Math.floor(Math.random() * (10 * difficulty)) + Math.floor(5 * difficulty);
                num2 = Math.floor(Math.random() * num1) + 1;
                answer = num1 - num2;
                break;
            case 2: // Vermenigvuldigen
                num1 = Math.floor(Math.random() * (5 * Math.sqrt(difficulty))) + 1;
                num2 = Math.floor(Math.random() * (5 * Math.sqrt(difficulty))) + 1;
                answer = num1 * num2;
                break;
            case 3: // Delen
                num2 = Math.floor(Math.random() * (5 * Math.sqrt(difficulty))) + 1;
                answer = Math.floor(Math.random() * (5 * Math.sqrt(difficulty))) + 1;
                num1 = num2 * answer;
                break;
        }

        mathProblem = {
            num1,
            num2,
            operation,
            answer
        };

        problemElement.textContent = `${num1} ${operation} ${num2} = ?`;
        answerElement.value = '';
        answerElement.focus();
    }

    // Controleer het antwoord
    function checkAnswer() {
        if (gameEnded) return;

        const userAnswer = parseInt(answerElement.value);

        if (isNaN(userAnswer)) {
            messageElement.textContent = "Voer een geldige waarde in";
            return;
        }

        if (userAnswer === mathProblem.answer) {
            messageElement.textContent = "Correct!";
            messageElement.style.color = "green";
            movePlayer(currentPlayer, config.speedPerCorrectAnswer);
            difficulty += config.difficultyIncrease;
            consecutiveWrong = 0; // Reset de fouten teller bij een goed antwoord
            hideHint(); // Verberg de hint als deze zichtbaar is
        } else {
            messageElement.textContent = `Helaas, het juiste antwoord was ${mathProblem.answer}`;
            messageElement.style.color = "#ff6b6b";
            consecutiveWrong++; // Verhoog de fouten teller

            // Toon een hint als de speler meerdere keren achter elkaar fout antwoord geeft
            if (consecutiveWrong >= config.consecutiveWrongThreshold) {
                showHint();
            }
        }

        // Volgende beurt
        clearInterval(timer);
        setTimeout(() => {
            nextTurn();
        }, 1500);
    }

    // Toon een hint
    function showHint() {
        let hintText = "";

        switch(mathProblem.operation) {
            case "+": // Optellen
                hintText = `Tip: Tel ${mathProblem.num1} en ${mathProblem.num2} bij elkaar op. ${mathProblem.num1} + ${mathProblem.num2} = ${mathProblem.answer}`;
                break;
            case "-": // Aftrekken
                hintText = `Tip: Trek ${mathProblem.num2} af van ${mathProblem.num1}. ${mathProblem.num1} - ${mathProblem.num2} = ${mathProblem.answer}`;
                break;
            case "×": // Vermenigvuldigen
                hintText = `Tip: Vermenigvuldig ${mathProblem.num1} met ${mathProblem.num2}. ${mathProblem.num1} × ${mathProblem.num2} = ${mathProblem.answer}`;
                break;
            case "÷": // Delen
                hintText = `Tip: Deel ${mathProblem.num1} door ${mathProblem.num2}. ${mathProblem.num1} ÷ ${mathProblem.num2} = ${mathProblem.answer}`;
                break;
        }

        hintElement.textContent = hintText;
        hintElement.style.display = "block";
    }

    // Verberg de hint
    function hideHint() {
        hintElement.style.display = "none";
    }

    // Verplaats een speler
    function movePlayer(playerIndex, distance) {
        const player = players[playerIndex];
        player.position += distance;

        // Zorg dat de speler niet verder komt dan het finish punt
        if (player.position > config.finishPosition) {
            player.position = config.finishPosition;
        }

        player.element.style.left = player.position + 'px';

        // Controleer of de speler heeft gewonnen
        if (player.position >= config.finishPosition) {
            endGame(playerIndex);
        }
    }

    // Computerbeurt
    function computerTurn() {
        // Simuleer een denktijd
        const thinkTime = Math.random() * 2000 + 1000;

        setTimeout(() => {
            // Computer heeft 80% kans op een goed antwoord
            const isCorrect = Math.random() < 0.8;

            if (isCorrect) {
                movePlayer(currentPlayer, config.speedPerCorrectAnswer);
                createSpeechBubble(currentPlayer, "Goed!");
            } else {
                createSpeechBubble(currentPlayer, "Fout...");
            }

            setTimeout(() => {
                nextTurn();
            }, 1000);
        }, thinkTime);
    }

    // Spraakbubbel maken
    function createSpeechBubble(playerIndex, text) {
        const player = players[playerIndex];
        const bubble = document.createElement('div');
        bubble.style.position = 'absolute';
        bubble.style.backgroundColor = 'white';
        bubble.style.border = '2px solid ' + player.color;
        bubble.style.borderRadius = '10px';
        bubble.style.padding = '5px 10px';
        bubble.style.bottom = (parseInt(player.element.style.bottom) + 80) + 'px';
        bubble.style.left = (player.position + 40) + 'px';
        bubble.style.transform = 'translateX(-50%)';
        bubble.textContent = text;
        bubble.style.zIndex = 5;

        raceTrack.appendChild(bubble);

        setTimeout(() => {
            bubble.remove();
        }, 1500);
    }

    // Timer starten
    function startTimer() {
        remainingTime = config.turnTime;
        timerElement.textContent = remainingTime;
        timerBar.style.width = '100%';

        timer = setInterval(() => {
            remainingTime--;
            timerElement.textContent = remainingTime;
            timerBar.style.width = (remainingTime / config.turnTime * 100) + '%';

            if (remainingTime <= 0) {
                clearInterval(timer);
                messageElement.textContent = "Tijd is op!";
                messageElement.style.color = "#ff6b6b";
                consecutiveWrong++;

                setTimeout(() => {
                    nextTurn();
                }, 1500);
            }
        }, 1000);
    }

    // Volgende speelbeurt
    function nextTurn() {
        clearInterval(timer);
        messageElement.textContent = "";

        // Volgende speler
        currentPlayer = (currentPlayer + 1) % config.playerCount;

        // Markeer de huidige speler
        players.forEach((p, i) => {
            if (i === currentPlayer) {
                p.element.style.transform = 'scale(1.1)';
            } else {
                p.element.style.transform = 'scale(1)';
            }
        });

        // Controleer of het de beurt van de gebruiker is
        if (currentPlayer === 0) {
            // Speler is aan de beurt
            generateMathProblem();
            startTimer();
            submitBtn.disabled = false;
            answerElement.disabled = false;
        } else {
            // Computer is aan de beurt
            problemElement.textContent = "Computer is aan de beurt...";
            answerElement.value = "";
            answerElement.disabled = true;
            submitBtn.disabled = true;
            computerTurn();
        }
    }

    // Einde van het spel
    function endGame(winnerIndex) {
        gameEnded = true;
        clearInterval(timer);

        const winner = players[winnerIndex];

        // Voeg confetti toe als de speler wint
        if (winnerIndex === 0) {
            createConfetti();
            gameOverTextElement.textContent = "Gefeliciteerd! Jij hebt gewonnen!";

            // Bereken score en sla deze op in de database
            const score = Math.round(difficulty * 10);
            saveScoreToDatabase(score);
        } else {
            gameOverTextElement.textContent = `${winner.name} heeft gewonnen!`;
        }

        gameOverElement.style.display = 'flex';
    }

    // Functie om score op te slaan in de database
    async function saveScoreToDatabase(score) {
        try {
            const token = localStorage.getItem("token");
            if (!token) {
                console.error("Geen token gevonden, score wordt niet opgeslagen.");
                return;
            }

            const response = await fetch("/api/scores/save", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    spel_id: config.SPEL_ID,
                    score: score
                })
            });

            if (response.ok) {
                console.log("Score succesvol opgeslagen!");
            } else {
                console.error("Fout bij opslaan van score:", await response.text());
            }
        } catch (error) {
            console.error("Fout bij opslaan van score:", error);
        }
    }

    // Maak confetti voor een winnende speler
    function createConfetti() {
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
            confetti.style.animationDelay = (Math.random() * 2) + 's';

            gameOverElement.appendChild(confetti);
        }
    }

    // Reset het spel
    function resetGame() {
        // Reset alle spelwaarden
        gameEnded = false;
        currentPlayer = 0;
        difficulty = 1;
        consecutiveWrong = 0;

        // Verwijder alle spelers uit de DOM
        players.forEach(player => {
            if (player.element) {
                player.element.remove();
            }
        });

        // Reset het spelbord
        gameOverElement.style.display = 'none';
        messageElement.textContent = "";

        // Initialiseer nieuwe spelers
        initializePlayers();

        // Start de eerste beurt
        nextTurn();
    }

    // Start het spel
    function startGame() {
        initializePlayers();
        nextTurn();
    }

    // Start het spel wanneer de pagina geladen is
    window.addEventListener('load', startGame);
</script>
</body>
</html>
