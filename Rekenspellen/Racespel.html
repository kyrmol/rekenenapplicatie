<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekenrace Groep 8</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e8f5ff;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }
        
        h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
            background-color: #a8e6cf;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .race-track {
            position: relative;
            height: 400px;
            background-image: linear-gradient(#a8e6cf, #dcedc1);
            border-bottom: 8px dashed #444;
        }
        
        .finish-line {
            position: absolute;
            top: 0;
            right: 50px;
            height: 100%;
            width: 10px;
            background: repeating-linear-gradient(
                45deg,
                #000,
                #000 10px,
                #fff 10px,
                #fff 20px
            );
        }
        
        .player {
            position: absolute;
            width: 80px;
            height: 80px;
            transition: left 0.5s ease;
        }
        
        .player-car {
            width: 100%;
            height: 100%;
        }
        
        .player-name {
            position: absolute;
            font-weight: bold;
            font-size: 12px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 2px 6px;
            border-radius: 10px;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }
        
        .control-panel {
            background-color: #ffd3b6;
            padding: 15px;
            border-radius: 0 0 15px 15px;
            position: relative;
        }
        
        .math-problem {
            font-size: 1.8em;
            font-weight: bold;
            margin: 10px 0;
            color: #444;
        }
        
        input {
            font-size: 1.5em;
            width: 100px;
            padding: 5px;
            text-align: center;
            border: 3px solid #ff8b94;
            border-radius: 10px;
            margin-right: 10px;
        }
        
        button {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.2em;
            background-color: #ff8b94;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            background-color: #ff6b6b;
            transform: scale(1.05);
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            height: 20px;
            margin-top: 10px;
            font-weight: bold;
            color: #ff6b6b;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2em;
            display: none;
            z-index: 100;
        }
        
        .game-over button {
            margin-top: 20px;
            font-size: 1em;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff6b6b;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall 3s linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(500px) rotate(360deg); opacity: 0; }
        }

        .timer-container {
            position: absolute;
            top: 40px;  /* Verlaagd van bovenkant scherm */
            right: 10px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #444;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-bar-container {
            width: 100%;
            height: 5px;
            background-color: #ddd;
            border-radius: 3px;
            margin-top: 3px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background-color: #ff6b6b;
            width: 100%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <h1>Rekenrace Groep 8!</h1>
    
    <div class="game-container">
        <div class="race-track">
            <div class="finish-line"></div>
            <div class="timer-container">
                <div>Tijd: <span id="timer">10</span>s</div>
                <div class="timer-bar-container">
                    <div class="timer-bar" id="timerBar"></div>
                </div>
            </div>
            
            <div class="player" id="player1" style="bottom: 10px; left: 10px;">
                <div class="player-name">Jij</div>
                <svg class="player-car" viewBox="0 0 100 100">
                    <rect x="10" y="30" width="80" height="40" rx="10" fill="#ff6b6b" />
                    <rect x="20" y="20" width="50" height="25" rx="5" fill="#ff9e9e" />
                    <circle cx="30" cy="70" r="12" fill="#333" />
                    <circle cx="30" cy="70" r="6" fill="#777" />
                    <circle cx="70" cy="70" r="12" fill="#333" />
                    <circle cx="70" cy="70" r="6" fill="#777" />
                </svg>
            </div>
            
            <div class="player" id="player2" style="bottom: 100px; left: 10px;">
                <div class="player-name">Bot 1</div>
                <svg class="player-car" viewBox="0 0 100 100">
                    <rect x="10" y="30" width="80" height="40" rx="10" fill="#4ecdc4" />
                    <rect x="20" y="20" width="50" height="25" rx="5" fill="#a8e6cf" />
                    <circle cx="30" cy="70" r="12" fill="#333" />
                    <circle cx="30" cy="70" r="6" fill="#777" />
                    <circle cx="70" cy="70" r="12" fill="#333" />
                    <circle cx="70" cy="70" r="6" fill="#777" />
                </svg>
            </div>
            
            <div class="player" id="player3" style="bottom: 190px; left: 10px;">
                <div class="player-name">Bot 2</div>
                <svg class="player-car" viewBox="0 0 100 100">
                    <rect x="10" y="30" width="80" height="40" rx="10" fill="#ffd3b6" />
                    <rect x="20" y="20" width="50" height="25" rx="5" fill="#ffe8d6" />
                    <circle cx="30" cy="70" r="12" fill="#333" />
                    <circle cx="30" cy="70" r="6" fill="#777" />
                    <circle cx="70" cy="70" r="12" fill="#333" />
                    <circle cx="70" cy="70" r="6" fill="#777" />
                </svg>
            </div>
            
            <div class="player" id="player4" style="bottom: 280px; left: 10px;">
                <div class="player-name">Bot 3</div>
                <svg class="player-car" viewBox="0 0 100 100">
                    <rect x="10" y="30" width="80" height="40" rx="10" fill="#c3aed6" />
                    <rect x="20" y="20" width="50" height="25" rx="5" fill="#e6d7f5" />
                    <circle cx="30" cy="70" r="12" fill="#333" />
                    <circle cx="30" cy="70" r="6" fill="#777" />
                    <circle cx="70" cy="70" r="12" fill="#333" />
                    <circle cx="70" cy="70" r="6" fill="#777" />
                </svg>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="math-problem" id="problem">Los op: 7 × 8 = ?</div>
            <input type="number" id="answer" placeholder="?" autofocus>
            <button id="submit">Antwoord!</button>
            <div class="message" id="message"></div>
        </div>
        
        <div class="game-over" id="gameOver">
            <div id="gameOverMessage">Je hebt gewonnen!</div>
            <button id="playAgain">Speel opnieuw</button>
        </div>
    </div>

    <script>
        // Spelconfiguratie
        const finishPosition = 700;
        const maxMoves = 15;
        const playerSpeed = 70;  // Afstand per correcte som voor speler
        const botMinSpeed = 30;  // Minimum snelheid voor bots
        const botMaxSpeed = 60;  // Maximum snelheid voor bots
        const questionTime = 10; // Tijd in seconden om een vraag te beantwoorden
        
        // Spelelementen
        const player1 = document.getElementById('player1');
        const player2 = document.getElementById('player2');
        const player3 = document.getElementById('player3');
        const player4 = document.getElementById('player4');
        const problem = document.getElementById('problem');
        const answerInput = document.getElementById('answer');
        const submitBtn = document.getElementById('submit');
        const message = document.getElementById('message');
        const gameOver = document.getElementById('gameOver');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const playAgainBtn = document.getElementById('playAgain');
        const timerElement = document.getElementById('timer');
        const timerBar = document.getElementById('timerBar');
        
        // Spelstatus
        let currentAnswer = 0;
        let moves = 0;
        let gameActive = true;
        let lockInput = false;
        let timeLeft = questionTime;
        let timer;
        let playerPositions = {
            player1: 10,
            player2: 10,
            player3: 10,
            player4: 10
        };
        
        // Functie om een willekeurig getal te genereren binnen een bereik
        function randomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        // Genereer een nieuwe rekensom
        function generateProblem() {
            let num1, num2, operation, problemText, answer;
            
            // Selecteer willekeurig een operatie (50% vermenigvuldiging, 25% optellen, 25% aftrekken)
            const opType = Math.random();
            
            if (opType < 0.5) {
                // Vermenigvuldiging
                num1 = randomNumber(2, 12);
                num2 = randomNumber(2, 12);
                operation = '×';
                answer = num1 * num2;
                problemText = `${num1} ${operation} ${num2} = ?`;
            } else if (opType < 0.75) {
                // Optellen
                num1 = randomNumber(10, 80);
                num2 = randomNumber(10, 50);
                operation = '+';
                answer = num1 + num2;
                problemText = `${num1} ${operation} ${num2} = ?`;
            } else {
                // Aftrekken (zorgen dat het antwoord positief is)
                num1 = randomNumber(30, 100);
                num2 = randomNumber(1, num1 - 1);
                operation = '-';
                answer = num1 - num2;
                problemText = `${num1} ${operation} ${num2} = ?`;
            }
            
            problem.textContent = `Los op: ${problemText}`;
            currentAnswer = answer;
            
            // Reset de timer
            resetTimer();
        }
        
        // Verplaats een speler
        function movePlayer(playerElement, playerId, distance) {
            playerPositions[playerId] += distance;
            playerElement.style.left = `${playerPositions[playerId]}px`;
            
            // Controleer of speler de finish heeft gehaald
            if (playerPositions[playerId] >= finishPosition) {
                endGame(playerId);
            }
        }
        
        // Verplaats de AI spelers
        function moveAIPlayers() {
            if (!gameActive) return;
            
            const ai1Speed = randomNumber(botMinSpeed, botMaxSpeed);
            const ai2Speed = randomNumber(botMinSpeed, botMaxSpeed);
            const ai3Speed = randomNumber(botMinSpeed, botMaxSpeed);
            
            movePlayer(player2, 'player2', ai1Speed);
            movePlayer(player3, 'player3', ai2Speed);
            movePlayer(player4, 'player4', ai3Speed);
            
            moves++;
            
            // Als het maximale aantal zetten is bereikt zonder winnaar
            if (moves >= maxMoves && gameActive) {
                endGame('maxMoves');
            }
        }
        
        // Spel beëindigen
        function endGame(winner) {
            gameActive = false;
            clearInterval(timer);
            
            if (winner === 'player1') {
                gameOverMessage.textContent = 'Je hebt gewonnen! 🎉';
                createConfetti();
            } else if (winner === 'maxMoves') {
                gameOverMessage.textContent = 'Tijd is op! Probeer nog eens.';
            } else {
                gameOverMessage.textContent = `${document.querySelector(`#${winner} .player-name`).textContent} heeft gewonnen! Probeer nog eens.`;
            }
            
            gameOver.style.display = 'flex';
        }
        
        // Maak confetti voor de winnaar
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffd3b6', '#c3aed6', '#ffeb3b'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = `${2 + Math.random() * 2}s`;
                confetti.style.animationDelay = `${Math.random() * 3}s`;
                
                document.querySelector('.game-container').appendChild(confetti);
                
                // Verwijder confetti na animatie
                setTimeout(() => {
                    if (confetti.parentNode) {
                        confetti.parentNode.removeChild(confetti);
                    }
                }, 5000);
            }
        }
        
        // Timer functies
        function resetTimer() {
            // Stop de huidige timer als die bestaat
            if (timer) {
                clearInterval(timer);
            }
            
            timeLeft = questionTime;
            timerElement.textContent = timeLeft;
            timerBar.style.width = '100%';
            
            // Start een nieuwe timer
            timer = setInterval(updateTimer, 1000);
            
            // Deblokeer input
            lockInput = false;
            answerInput.disabled = false;
            submitBtn.disabled = false;
            
            // Focus op het input veld
            answerInput.focus();
        }
        
        function updateTimer() {
            timeLeft--;
            timerElement.textContent = timeLeft;
            timerBar.style.width = `${(timeLeft / questionTime) * 100}%`;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                message.textContent = 'Tijd is op!';
                message.style.color = 'red';
                
                // Vergrendel input tot de volgende vraag
                lockInput = true;
                answerInput.disabled = true;
                submitBtn.disabled = true;
                
                // AI spelers gaan vooruit, speler blijft staan
                moveAIPlayers();
                
                // Wacht even en genereer dan een nieuwe som
                setTimeout(() => {
                    if (gameActive) {
                        generateProblem();
                        message.textContent = '';
                        answerInput.value = '';
                    }
                }, 1500);
            }
        }
        
        // Controleer het antwoord van de speler
        function checkAnswer() {
            // Voorkom het controleren tijdens een transitie of als het spel niet actief is
            if (lockInput || !gameActive) {
                return;
            }
            
            const userAnswer = parseInt(answerInput.value);
            
            if (isNaN(userAnswer)) {
                message.textContent = 'Voer een getal in!';
                return;
            }
            
            // Vergrendel de input om spammen te voorkomen
            lockInput = true;
            answerInput.disabled = true;
            submitBtn.disabled = true;
            
            // Stop de timer
            clearInterval(timer);
            
            if (userAnswer === currentAnswer) {
                message.textContent = 'Goed gedaan!';
                message.style.color = 'green';
                movePlayer(player1, 'player1', playerSpeed);
            } else {
                message.textContent = 'Oeps, dat is niet juist!';
                message.style.color = 'red';
            }
            
            // AI spelers bewegen na elke poging van de speler
            moveAIPlayers();
            
            // Wacht even en genereer dan een nieuwe som
            setTimeout(() => {
                if (gameActive) {
                    generateProblem();
                    message.textContent = '';
                    answerInput.value = '';
                }
            }, 1500);
        }
        
        // Event listeners
        submitBtn.addEventListener('click', checkAnswer);
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // Voorkom standaard form submit
                checkAnswer();
            }
        });
        
        playAgainBtn.addEventListener('click', () => {
            // Reset het spel
            playerPositions = {
                player1: 10,
                player2: 10,
                player3: 10,
                player4: 10
            };
            
            player1.style.left = '10px';
            player2.style.left = '10px';
            player3.style.left = '10px';
            player4.style.left = '10px';
            
            moves = 0;
            gameActive = true;
            lockInput = false;
            
            // Verwijder alle confetti
            document.querySelectorAll('.confetti').forEach(el => {
                el.parentNode.removeChild(el);
            });
            
            gameOver.style.display = 'none';
            message.textContent = '';
            answerInput.value = '';
            answerInput.disabled = false;
            submitBtn.disabled = false;
            
            generateProblem();
        });
        
        // Start het spel
        generateProblem();
    </script>
</body>
</html>
